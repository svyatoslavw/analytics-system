version: "3.9"

services:
  api:
    build: 
      context: ./apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/api/src:/app/src:rw
      - ./apps/api/dist:/app/dist:rw
      - /app/node_modules
    working_dir: /app
    depends_on:
      - redis
      - clickhouse
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: yarn.lock
        - action: sync
          path: ./apps/api/src
          target: /app/src
          ignore:
            - "**/*.test.ts"
            - "**/*.spec.ts"

  worker:
    build: 
      context: ./apps/worker
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - CLICKHOUSE_URL=http://clickhouse:8123
    volumes:
      - ./apps/worker/src:/app/src:rw
      - ./apps/worker/dist:/app/dist:rw
      - /app/node_modules
    depends_on:
      - redis
      - clickhouse
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: yarn.lock
        - action: sync
          path: ./apps/api/src
          target: /app/src
          ignore:
            - "**/*.test.ts"
            - "**/*.spec.ts"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  redis_data:
  clickhouse_data: